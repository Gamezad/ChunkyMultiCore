# Chunky Configuration
# https://github.com/pop4959/Chunky/wiki/Configuration
config {
  continue-on-restart=false
  force-load-existing-chunks=false
  language=en
  # Maximum number of chunks each generation task works on concurrently.
  # Higher values let the server generate chunks on more CPU cores at the same
  # time. 0 means "auto" (4 x CPU cores, at least 50).
  max-working-count=0
  silent=false
  update-interval=1
  version=2
}
